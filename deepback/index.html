<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DEEPBACK</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #e9f3f2;
    --muted: #9fb8bb;
    --panel: rgba(8, 20, 26, 0.62);
    --line: rgba(160, 230, 230, 0.18);
    --accent: #58f0d8;
    --warn: #ffb35a;
    --danger: #ff5a5a;
    --relic: #7ff6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #071016; color: var(--ink); font-family: Manrope, system-ui, sans-serif; }
  #app canvas { display: block; }
  .hidden { display: none !important; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(6px); }
  #topbar { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  #day { min-width: 240px; }
  .label { font-size: 12px; letter-spacing: .18em; color: var(--muted); }
  .label b { color: var(--ink); font-size: 16px; }
  .bar { height: 8px; background: rgba(255,255,255,.1); border-radius: 6px; overflow: hidden; margin: 7px 0 5px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .2s linear, background .4s; }
  .bar > div.warn { background: var(--warn); }
  .bar > div.danger { background: var(--danger); }
  #timetxt { font-size: 13px; font-weight: 600; }
  #ark { font-size: 15px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
  #ark b { font-weight: 800; }
  #need { flex-basis: 100%; text-align: right; font-size: 12px; color: var(--muted); }
  #prompt { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 9px 16px; border-radius: 10px; font-size: 15px; white-space: nowrap; }
  #prompt b { color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 0 6px; }
  #bottom { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 10px; align-items: center; }
  #cargo { font-size: 18px; display: flex; gap: 6px; align-items: center; }
  #cargo .lbl { font-size: 12px; color: var(--muted); letter-spacing: .1em; margin-right: 4px; }
  #cargo .empty { font-size: 13px; color: var(--muted); }
  #cargo .it.relic { color: var(--relic); text-shadow: 0 0 8px var(--relic); }
  #oxy { display: flex; gap: 8px; align-items: center; min-width: 180px; }
  #oxy .bar { flex: 1; margin: 0; }
  #oxybar { background: #8fd8ff !important; }
  #oxybar.danger { background: var(--danger) !important; }
  #compass { position: absolute; right: 14px; bottom: 14px; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; }
  #arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 26px solid var(--accent); transform-origin: 50% 60%; margin-top: -8px; }
  #dist { position: absolute; bottom: 12px; font-size: 11px; color: var(--muted); }
  #compass .cap { position: absolute; top: 9px; font-size: 9px; letter-spacing: .14em; color: var(--muted); }
  #toasts { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(92vw, 560px); }
  .toast { background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; font-size: 14px; text-align: center; transition: opacity .6s, transform .6s; }
  .toast.out { opacity: 0; transform: translateY(-8px); }
  .toast.warn { border-color: var(--warn); color: #ffe0b8; }
  .toast.danger { border-color: var(--danger); color: #ffd0d0; font-weight: 800; }
  .toast.ok { border-color: var(--accent); }
  .toast.relic { border-color: var(--relic); color: #d8fdff; }
  #hud.alarm::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 120px rgba(255, 40, 40, .45); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  #under { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(20,90,110,.05), rgba(0,20,30,.55)); opacity: 0; transition: opacity .3s; }
  body.underwater #under { opacity: 1; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.5); }

  .screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(4,14,20,.55), rgba(2,6,10,.92)); overflow-y: auto; }
  .card { width: min(640px, 100%); background: rgba(8, 20, 26, 0.85); border: 1px solid var(--line); border-radius: 18px; padding: 28px 30px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .card.wide { width: min(820px, 100%); }
  .card h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(44px, 11vw, 88px); letter-spacing: .06em; margin: 0; line-height: .95; color: #f2fbfa; text-shadow: 0 0 40px rgba(88,240,216,.25); }
  .card h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin: 0 0 12px; }
  .card h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin: 18px 0 4px; color: var(--relic); }
  .tag { color: var(--accent); letter-spacing: .3em; font-size: 12px; margin: 8px 0 18px; }
  .card p { line-height: 1.6; color: #cfe2e2; margin: 0 0 12px; white-space: pre-line; }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; color: var(--muted); margin: 16px 0 22px; }
  .controls kbd { color: var(--ink); font-family: inherit; font-weight: 800; }
  button { font: inherit; font-weight: 800; letter-spacing: .08em; background: var(--accent); color: #032; border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  #modal-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  button.choice { flex: 1 1 220px; text-align: left; background: rgba(88,240,216,.08); color: var(--ink); border: 1px solid var(--accent); }
  button.choice small { display: block; font-weight: 400; letter-spacing: 0; margin-top: 6px; color: var(--muted); line-height: 1.4; }
  #modal-body { max-height: 58vh; overflow-y: auto; }
  @media (max-width: 640px) {
    #day { min-width: 0; flex: 1; }
    #ark { justify-content: flex-start; }
    #need { text-align: left; }
    #prompt { white-space: normal; width: 90vw; text-align: center; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="under"></div>

<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="topbar">
    <div class="panel" id="day">
      <div class="label">ДЕНЬ <b id="cycle">1</b></div>
      <div class="bar"><div id="timebar"></div></div>
      <div id="timetxt"></div>
    </div>
    <div class="panel" id="ark">
      <span title="Жители">👥 <b id="pop">12</b></span>
      <span title="Рыба">🐟 <b id="food">0</b></span>
      <span title="Ворвань">🛢️ <b id="fuel">0</b></span>
      <span title="Реликвии" style="color:var(--relic)">◈ <b id="lore">0</b>/7</span>
      <div id="need"></div>
    </div>
  </div>
  <div id="toasts"></div>
  <div id="prompt" class="hidden"></div>
  <div id="bottom">
    <div class="panel" id="cargo"></div>
    <div class="panel hidden" id="oxy"><span>O₂</span><div class="bar"><div id="oxybar"></div></div></div>
  </div>
  <div class="panel" id="compass"><span class="cap">КОВЧЕГ</span><div id="arrow"></div><span id="dist"></span></div>
</div>

<div class="screen" id="menu">
  <div class="card">
    <h1>DEEPBACK</h1>
    <div class="tag">ГОРОД НА СПИНЕ МАТЕРИ</div>
    <p id="intro"></p>
    <div class="controls">
      <kbd>WASD</kbd><span>идти · <b>Shift</b> — бег</span>
      <kbd>Мышь</kbd><span>камера (клик — захватить курсор)</span>
      <kbd>Space</kbd><span>прыжок / всплыть · <b>C</b> — нырнуть</span>
      <kbd>E</kbd><span>подобрать / сдать груз у шлюза</span>
      <kbd>R</kbd><span>у шлюза: укрыться и закончить день</span>
      <kbd>J</kbd><span>журнал реликвий</span>
    </div>
    <button id="start">НАЧАТЬ ПЕРВЫЙ ДЕНЬ</button>
  </div>
</div>

<div class="screen hidden" id="modal">
  <div class="card">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-buttons"></div>
  </div>
</div>

<div class="screen hidden" id="pause">
  <div class="card" style="text-align:center">
    <h2>Пауза</h2>
    <p>Кликни, чтобы продолжить.</p>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
