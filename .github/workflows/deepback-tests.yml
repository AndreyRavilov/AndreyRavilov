name: DEEPBACK tests

on:
  push:
    paths: ['deepback/**', '.github/workflows/deepback-tests.yml']
  pull_request:
    paths: ['deepback/**', '.github/workflows/deepback-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
